name: PR governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  governance:
    name: PR governance
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validar metadados do PR
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.pull_request;
          if (!pr || !process.env.GITHUB_REPOSITORY) {
            console.error('Evento de pull request ou repositório ausente.');
            process.exit(1);
          }

          const branch = String(pr.head?.ref ?? '');
          const author = String(pr.user?.login ?? '');
          const isGitHubWebPatchBranch = /^[\w.-]+-patch-\d+$/.test(branch);
          const isDependencyBot = pr.user?.type === 'Bot' && (
            (author === 'dependabot[bot]' && /^dependabot\/\S+$/.test(branch)) ||
            (author === 'renovate[bot]' && /^renovate\/\S+$/.test(branch))
          );
          if (isDependencyBot) {
            console.log('Automação de dependências reconhecida; regras de metadados dispensadas.');
            process.exit(0);
          }

          const errors = [];
          const title = String(pr.title ?? '');
          const titlePattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()\r\n]+\))?!?: \S[^\r\n]*$/;
          if (!isGitHubWebPatchBranch && (!titlePattern.test(title) || /[\x00-\x1f\x7f]/.test(title))) {
            errors.push('Título inválido. Exemplo: fix(api): corrige validação de entrada.');
          }
          const branchPattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|migration|hotfix|codex)\/\S+$/;
          if (!branchPattern.test(branch) && !isGitHubWebPatchBranch) {
            errors.push('Branch inválida. Use um prefixo permitido, como fix/123-corrige-validacao ou migration/java-2.0.');
          }

          const visibleLines = [];
          let fence = null;
          let inComment = false;
          for (const rawLine of String(pr.body ?? '').split(/\r?\n/)) {
            if (fence) {
              const closing = /^ {0,3}(`+|~+)[ \t]*$/.exec(rawLine);
              if (closing && closing[1][0] === fence[0] && closing[1].length >= fence.length) {
                fence = null;
              }
              continue;
            }
            if (!inComment && /^(?: {4}| {0,3}\t)/.test(rawLine)) continue;
            const rawOpening = /^ {0,3}(`{3,}|~{3,})/.exec(rawLine);
            if (!inComment && rawOpening) {
              fence = rawOpening[1];
              continue;
            }

            let line = '';
            let offset = 0;
            while (offset < rawLine.length) {
              if (inComment) {
                const end = rawLine.indexOf('-->', offset);
                if (end === -1) break;
                inComment = false;
                offset = end + 3;
              } else {
                const start = rawLine.indexOf('<!--', offset);
                if (start === -1) {
                  line += rawLine.slice(offset);
                  break;
                }
                line += rawLine.slice(offset, start);
                inComment = true;
                offset = start + 4;
              }
            }
            if (/^(?: {4}| {0,3}\t)/.test(line)) continue;
            const opening = /^ {0,3}(`{3,}|~{3,})/.exec(line);
            if (opening) {
              fence = opening[1];
              continue;
            }
            visibleLines.push(line);
          }
          const body = visibleLines.join('\n')
            .replace(/(?<!`)(`+)(?!`)[\s\S]*?(?<!`)\1(?!`)/g,
              span => span.replace(/[^\r\n]/g, '\u0000'));
          const repo = process.env.GITHUB_REPOSITORY.toLowerCase();
          const references = [...body.matchAll(/^[ \t]*(?:[-*][ \t]+)?(?:Closes|Fixes|Resolves)[ \t]+(\S+?)[ \t]*\.?[ \t]*$/gim)];
          const linkedIssue = references.some(([, reference]) => {
            if (/^#[1-9]\d*$/.test(reference)) return true;
            try {
              const url = new URL(reference);
              return url.protocol === 'https:' && url.hostname === 'github.com' &&
                !url.port && !url.username && !url.password && !url.search && !url.hash &&
                url.pathname.toLowerCase().startsWith('/' + repo + '/issues/') &&
                /^\/[\w.-]+\/[\w.-]+\/issues\/[1-9]\d*$/.test(url.pathname);
            } catch {
              return false;
            }
          });
          if (!linkedIssue && !isGitHubWebPatchBranch) {
            errors.push('Inclua uma linha Closes #123, Fixes #123 ou Resolves #123, ou a URL completa de uma issue deste repositório.');
          }

          if (errors.length) {
            for (const error of errors) console.error(error);
            process.exit(1);
          }
          console.log('Metadados válidos. Este check não substitui os testes e a revisão do projeto.');
          NODE
