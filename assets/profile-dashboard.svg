<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Painel tecnico do portfolio de Joao Victor</title>
  <desc id="desc">Resumo visual das frentes de produto, C e C++, sistemas locais, interface, qualidade e governanca.</desc>
  <rect width="1200" height="360" rx="28" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" stroke="#CBD5E1" stroke-width="2"/>

  <text x="56" y="60" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Portfolio tecnico em construcao verificavel</text>
  <text x="56" y="92" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="18">Produto, fundamentos, runtime local, interface e governanca documentada por evidencias.</text>

  <g transform="translate(56 130)">
    <rect width="240" height="112" rx="18" fill="#0F172A"/>
    <text x="22" y="34" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">PRODUTO PRINCIPAL</text>
    <text x="22" y="64" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Desk Imperial</text>
    <text x="22" y="91" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">App, API, dominio e tempo real</text>
  </g>

  <g transform="translate(326 130)">
    <rect width="240" height="112" rx="18" fill="#EEF2FF"/>
    <rect width="240" height="112" rx="18" stroke="#C7D2FE"/>
    <text x="22" y="34" fill="#4338CA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">BASE TECNICA</text>
    <text x="22" y="64" fill="#1E1B4B" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">C / C++</text>
    <text x="22" y="91" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="15">Redes, memoria e estruturas</text>
  </g>

  <g transform="translate(596 130)">
    <rect width="240" height="112" rx="18" fill="#ECFDF5"/>
    <rect width="240" height="112" rx="18" stroke="#A7F3D0"/>
    <text x="22" y="34" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">SISTEMAS LOCAIS</text>
    <text x="22" y="64" fill="#064E3B" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">TX / Sentinel</text>
    <text x="22" y="91" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="15">Audio, logs, politicas e fallback</text>
  </g>

  <g transform="translate(866 130)">
    <rect width="278" height="112" rx="18" fill="#FFF7ED"/>
    <rect width="278" height="112" rx="18" stroke="#FED7AA"/>
    <text x="22" y="34" fill="#C2410C" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">INTERFACE E DEMOS</text>
    <text x="22" y="64" fill="#7C2D12" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">React + Pages</text>
    <text x="22" y="91" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="15">Uso, responsividade e apresentacao</text>
  </g>

  <g transform="translate(56 275)">
    <rect width="1088" height="42" rx="21" fill="#FFFFFF"/>
    <rect width="1088" height="42" rx="21" stroke="#CBD5E1"/>
    <circle cx="30" cy="21" r="7" fill="#2563EB"/>
    <text x="52" y="27" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="16">Fluxo de leitura: problema -> arquitetura -> execucao -> testes -> evidencia -> limites conhecidos -> proximos passos</text>
  </g>
